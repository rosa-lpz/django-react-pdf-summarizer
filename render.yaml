# Render Blueprint - Infrastructure as Code
# https://render.com/docs/blueprint-spec
# Uses production Dockerfiles optimized for Render

services:
  # Backend Django API (Docker)
  - type: web
    name: pdf-summarizer-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pdf-summarizer-frontend.onrender.com"
    healthCheckPath: /core/

  # Frontend React (Static Site)
  - type: web
    name: pdf-summarizer-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://pdf-summarizer-backend.onrender.com/core
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
